name: Nexu Forge Android v0.11.0 RC
on:
  push:
    branches: [build/nexu-forge-android-v0.11.0]
    paths: [android-build/nexu-forge-v0.11.0/READY]
permissions:
  contents: read
concurrency:
  group: nexu-forge-android-v0.11.0
  cancel-in-progress: false
jobs:
  android-release-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          sparse-checkout: android-build
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c
        with:
          distribution: microsoft
          java-version: '21.0.11'
          verify-signature: true
      - name: Recover protected input and apply Android-only fixes
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence tools
          python3 - <<'PY'
          import base64, pathlib, hashlib, zipfile, io, shutil
          root=pathlib.Path('android-build/nexu-forge-v0.11.0')
          parts=sorted(root.glob('project.b64.part-*'))
          assert len(parts)==11
          first=parts[0].read_bytes().strip()
          assert len(first)==6001 and first[-1:]==b'I'
          data=base64.b64decode(first[:-1]+b''.join(p.read_bytes().strip() for p in parts[1:]),validate=True)
          digest=hashlib.sha256(data).hexdigest()
          assert digest=='d4f72e0cf2454f826c9554b42399dc29065e44bd1e163a1d6570560fd994508a'
          archive=zipfile.ZipFile(io.BytesIO(data)); assert archive.testzip() is None
          for n in archive.namelist():
              assert not pathlib.PurePosixPath(n).is_absolute() and '..' not in pathlib.PurePosixPath(n).parts
          archive.extractall('project')
          pathlib.Path('evidence/baseline-recovery.txt').write_text('SHA256: '+digest+'\nZIP CRCs pass. One inserted I removed at encoded offset 6000. Desktop baseline not modified.\n')
          shutil.copytree(root/'overrides','project',dirs_exist_ok=True)
          PY
          if [ -f android-build/nexu-forge-v0.11.0/harden.py ]; then python3 android-build/nexu-forge-v0.11.0/harden.py project; fi
      - name: Provision pinned Android SDK
        shell: bash
        run: |
          set -euo pipefail
          MANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          set +o pipefail
          yes | "$MANAGER" --licenses > evidence/sdk-licences.log
          set -o pipefail
          "$MANAGER" 'platforms;android-36' 'build-tools;36.0.0' 'platform-tools'
          "$MANAGER" --list_installed > evidence/sdk-installed.txt
          cp "$ANDROID_HOME/platforms/android-36/android.jar" tools/
          BT="$ANDROID_HOME/build-tools/36.0.0"
          cp "$BT/lib/apksigner.jar" "$BT/zipalign" "$BT/aapt2" tools/
          ldd "$BT/zipalign" > evidence/zipalign-libraries.txt
          for LIB in $(ldd "$BT/zipalign" | awk '/libc\+\+|libc\+\+abi|libunwind/ {print $3}'); do cp -L "$LIB" tools/; done
          (cd tools && sha256sum *) > evidence/tool-sha256.txt
      - name: Provision checksum-pinned Gradle
        shell: bash
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -fLsS https://services.gradle.org/distributions/gradle-9.5.0-bin.zip -o "$RUNNER_TEMP/gradle.zip"
          echo "553c78f50dafcd54d65b9a444649057857469edf836431389695608536d6b746  $RUNNER_TEMP/gradle.zip" | sha256sum -c - > evidence/gradle-download-verification.txt
          unzip -q "$RUNNER_TEMP/gradle.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/gradle-9.5.0/bin" >> "$GITHUB_PATH"
      - name: Compile, unit test, lint and assemble unsigned release
        shell: bash
        run: |
          set -euo pipefail
          java -version 2> evidence/java-version.txt
          gradle --version > evidence/gradle-version.txt
          gradle -p project wrapper --gradle-version 9.5.0 --distribution-type bin --gradle-distribution-sha256-sum 553c78f50dafcd54d65b9a444649057857469edf836431389695608536d6b746 --no-daemon
          gradle -p project clean testReleaseUnitTest lintRelease assembleRelease --no-daemon --stacktrace --warning-mode all 2>&1 | tee evidence/build.log
          python3 - <<'PY'
          import pathlib, xml.etree.ElementTree as E
          files=list(pathlib.Path('project/app/build/test-results').rglob('TEST-*.xml'))
          assert files,'No executed unit-test XML'
          results=[E.parse(f).getroot() for f in files]
          n=sum(int(r.get('tests','0')) for r in results)
          assert n>=4 and all(int(r.get('failures','0'))==0 and int(r.get('errors','0'))==0 and int(r.get('skipped','0'))==0 for r in results)
          lint=E.parse('project/app/build/reports/lint-results-release.xml').getroot()
          issues=[i for i in lint.findall('issue') if i.get('severity') in ('Error','Fatal')]
          assert not issues
          pathlib.Path('evidence/tests-lint-summary.txt').write_text(f'{n} executed tests: PASS\nLint errors: 0\n')
          PY
      - name: Align and enforce APK identity
        shell: bash
        run: |
          set -euo pipefail
          BT="$ANDROID_HOME/build-tools/36.0.0"
          APK=project/app/build/outputs/apk/release/app-release-unsigned.apk
          test -f "$APK"
          "$BT/zipalign" -P 16 -f -v 4 "$APK" evidence/Nexu-AI-3D-Forge-Android-v0.11.0-unsigned-aligned.apk > evidence/zipalign-build.txt
          "$BT/zipalign" -c -P 16 -v 4 evidence/*-unsigned-aligned.apk > evidence/zipalign-verify.txt
          "$BT/aapt2" dump badging evidence/*-unsigned-aligned.apk > evidence/apk-metadata.txt
          grep -q "name='uk.co.sumerostudio.nexuai3dforge' versionCode='110' versionName='0.11.0'" evidence/apk-metadata.txt
          grep -q "sdkVersion:'30'" evidence/apk-metadata.txt
          grep -q "targetSdkVersion:'36'" evidence/apk-metadata.txt
          sha256sum evidence/*-unsigned-aligned.apk > evidence/unsigned-apk.sha256
      - name: Retain exact build inputs and all reports
        if: always()
        shell: bash
        run: |
          mkdir -p evidence
          printf '%s\n' "$GITHUB_SHA" > evidence/commit.txt
          if [ -d project/app/build/reports ]; then cp -r project/app/build/reports evidence/; fi
          if [ -d project/app/build/test-results ]; then cp -r project/app/build/test-results evidence/; fi
          if [ -d project ]; then (cd project && zip -qr ../evidence/corrected-source.zip . -x '.gradle/*' 'app/build/*' 'build/*'); fi
          find "$HOME/.gradle/caches/modules-2/files-2.1" -type f \( -name 'junit-4.13.2.jar' -o -name 'hamcrest-core-1.3.jar' -o -name 'json-20260719.jar' \) -exec cp '{}' tools/ \;
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: nexu-forge-android-v0.11.0-evidence
          path: evidence/
          retention-days: 14
          if-no-files-found: error
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: nexu-forge-build-tools-36.0.0
          path: tools/
          retention-days: 7
          if-no-files-found: warn
