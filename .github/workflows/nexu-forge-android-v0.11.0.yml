name: Nexu Forge Android v0.11.0 RC
on:
  push:
    branches: [build/nexu-forge-android-v0.11.0]
    paths: [android-build/nexu-forge-v0.11.0/READY]
permissions:
  contents: read
concurrency:
  group: nexu-forge-android-v0.11.0
  cancel-in-progress: false
jobs:
  android-release-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          sparse-checkout: android-build
      - name: Verify toolchain, compile, test, lint, align and smoke-test
        shell: bash
        run: bash android-build/nexu-forge-v0.11.0/ci-build.sh
      - name: Retain complete corrected source and raw evidence
        if: always()
        shell: bash
        run: |
          mkdir -p evidence tools
          printf '%s\n' "$GITHUB_SHA" > evidence/commit.txt
          if [ -d project/app/build/reports ]; then cp -r project/app/build/reports evidence/; fi
          if [ -d project/app/build/test-results ]; then cp -r project/app/build/test-results evidence/; fi
          if [ -d project ]; then (cd project && zip -qr ../evidence/corrected-source.zip . -x '.gradle/*' 'app/build/*' 'build/*'); fi
          if [ -d "$HOME/.gradle/caches/modules-2/files-2.1" ]; then find "$HOME/.gradle/caches/modules-2/files-2.1" -type f \( -name 'junit-4.13.2.jar' -o -name 'hamcrest-core-1.3.jar' -o -name 'json-20260719.jar' \) -exec cp '{}' tools/ \;; fi
          if [ -n "$(ls -A tools)" ]; then (cd tools && sha256sum *) > evidence/tool-sha256.txt; fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: nexu-forge-android-v0.11.0-evidence
          path: evidence/
          retention-days: 14
          if-no-files-found: error
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: nexu-forge-build-tools-36.0.0
          path: tools/
          retention-days: 7
          if-no-files-found: warn
