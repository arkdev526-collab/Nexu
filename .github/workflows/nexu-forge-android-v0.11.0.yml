name: Nexu Forge Android v0.11.0 RC
on:
  push:
    branches: [build/nexu-forge-android-v0.11.0]
permissions:
  contents: read
jobs:
  source-recovery:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          sparse-checkout: android-build
      - name: Preserve original staged source and diagnose encoding
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p recovery/parts
          cp android-build/nexu-forge-v0.11.0/project.b64.part-* recovery/parts/
          python3 - <<'PY'
          import pathlib, hashlib, json, base64
          root=pathlib.Path('recovery')
          rows=[]
          for p in sorted((root/'parts').glob('*')):
              raw=p.read_bytes()
              rows.append({'name':p.name,'length':len(raw),'sha256':hashlib.sha256(raw).hexdigest()})
          (root/'source-diagnostics.json').write_text(json.dumps(rows,indent=2))
          print(json.dumps(rows,indent=2))
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: nexu-forge-android-source-recovery
          path: recovery/
          if-no-files-found: error
          retention-days: 7
