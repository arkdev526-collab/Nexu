name: Minted Up CI

on:
  workflow_dispatch:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: mintedup-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Tests, lint, typecheck, production build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CI: "true"
      MINTEDUP_DATA_DIR: /tmp/mintedup-ci
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Domain regression tests
        run: npm test

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Production build
        run: npm run build
