name: Sumero Camera APK

on:
  push:
    branches:
      - sumero-dslr-apk-build-20260926
    paths:
      - ".sumero-camera/**"
      - ".github/workflows/sumero-camera-apk.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build release APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Gradle 9.6.0
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"

      - name: Reconstruct camera project
        shell: bash
        run: |
          set -euo pipefail
          cat .sumero-camera/part*.b64 | base64 --decode > /tmp/sumero-camera.zip
          unzip -t /tmp/sumero-camera.zip
          rm -rf /tmp/sumero-camera
          mkdir -p /tmp/sumero-camera
          unzip -q /tmp/sumero-camera.zip -d /tmp/sumero-camera
          test -f /tmp/sumero-camera/Sumero-DSLR-AI-Camera-v0.1.0-SOLO/settings.gradle.kts

      - name: Build and test Release
        working-directory: /tmp/sumero-camera/Sumero-DSLR-AI-Camera-v0.1.0-SOLO
        shell: bash
        run: |
          set -euo pipefail
          printf 'sdk.dir=%s\n' "$ANDROID_HOME" > local.properties
          gradle --no-daemon clean testReleaseUnitTest lintRelease assembleRelease

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail
          APK=/tmp/sumero-camera/Sumero-DSLR-AI-Camera-v0.1.0-SOLO/app/build/outputs/apk/release/app-release.apk
          test -s "$APK"
          unzip -t "$APK"
          sha256sum "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Sumero-DSLR-AI-Camera-v0.1.0
          path: /tmp/sumero-camera/Sumero-DSLR-AI-Camera-v0.1.0-SOLO/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
