name: Sumero Camera APK

on:
  push:
    branches:
      - sumero-dslr-apk-build-20260926
    paths:
      - ".sumero-camera/**"
      - ".github/workflows/sumero-camera-apk.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build release APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -path '*/bin/sdkmanager' | sort -V | tail -n 1)"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --licenses >/dev/null || true
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" "platforms;android-36" "platforms;android-37" "build-tools;36.0.0" "platform-tools"

      - name: Gradle 9.6.0
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"

      - name: Reconstruct camera project
        shell: bash
        run: |
          set -euo pipefail
          cat .sumero-camera/part*.b64 | base64 --decode > /tmp/sumero-camera.zip
          unzip -t /tmp/sumero-camera.zip
          rm -rf /tmp/sumero-camera
          mkdir -p /tmp/sumero-camera
          unzip -q /tmp/sumero-camera.zip -d /tmp/sumero-camera
          test -f /tmp/sumero-camera/Sumero-DSLR-AI-Camera-v0.1.0-SOLO/settings.gradle.kts

      - name: Apply verified source fixes
        shell: bash
        run: |
          set -euo pipefail
          PROJECT=/tmp/sumero-camera/Sumero-DSLR-AI-Camera-v0.1.0-SOLO
          python3 - <<'PY'
          from pathlib import Path
          root = Path('/tmp/sumero-camera/Sumero-DSLR-AI-Camera-v0.1.0-SOLO')
          p = root / 'app/build.gradle.kts'
          text = p.read_text()
          text = text.replace('compileSdk = 36', 'compileSdk = 37')
          p.write_text(text)

          p = root / 'app/src/main/kotlin/studio/sumero/dslrai/ui/CameraScreen.kt'
          text = p.read_text().replace('import androidx.compose.foundation.layout.weight\\n', '')
          p.write_text(text)

          p = root / 'app/src/main/kotlin/studio/sumero/dslrai/camera/CameraCapabilityScanner.kt'
          text = p.read_text()
          old = '''            val equivalentFocalMm = if (size != null && !focalLengths.isNullOrEmpty()) {
                val sensorDiagonal = sqrt(size.width * size.width + size.height * size.height)
                if (sensorDiagonal > 0f) focalLengths.first() * 43.2666f / sensorDiagonal else null
            } else null'''
          new = '''            val equivalentFocalMm = focalLengths?.firstOrNull()?.let { focalLength ->
                if (size != null) {
                    val sensorDiagonal = sqrt(size.width * size.width + size.height * size.height)
                    if (sensorDiagonal > 0f) focalLength * 43.2666f / sensorDiagonal else null
                } else null
            }'''
          if old not in text:
              raise SystemExit('CameraCapabilityScanner patch target not found')
          p.write_text(text.replace(old, new))
          PY

      - name: Build and test Release
        working-directory: /tmp/sumero-camera/Sumero-DSLR-AI-Camera-v0.1.0-SOLO
        shell: bash
        run: |
          set -euo pipefail
          printf 'sdk.dir=%s\n' "$ANDROID_HOME" > local.properties
          gradle --no-daemon clean lintRelease assembleRelease

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail
          APK=/tmp/sumero-camera/Sumero-DSLR-AI-Camera-v0.1.0-SOLO/app/build/outputs/apk/release/app-release.apk
          test -s "$APK"
          unzip -t "$APK"
          sha256sum "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Sumero-DSLR-AI-Camera-v0.1.0
          path: /tmp/sumero-camera/Sumero-DSLR-AI-Camera-v0.1.0-SOLO/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
