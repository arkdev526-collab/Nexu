name: Minted Up Dependency Audit

on:
  push:
    branches:
      - chatgpt/mintedup-production-hardening
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: npm audit report
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Audit all dependencies
        run: npm audit --json > npm-audit.json || true

      - name: Audit production dependencies only
        run: npm audit --omit=dev --json > npm-audit-production.json || true

      - name: Print audit summaries
        run: |
          node - <<'NODE'
          const fs = require('fs');
          for (const [label, filename] of [
            ['ALL_DEPENDENCIES', 'npm-audit.json'],
            ['PRODUCTION_ONLY', 'npm-audit-production.json'],
          ]) {
            const audit = JSON.parse(fs.readFileSync(filename, 'utf8'));
            console.log(`===== ${label} =====`);
            console.log(JSON.stringify({
              metadata: audit.metadata,
              vulnerabilities: audit.vulnerabilities,
            }, null, 2));
          }
          NODE

      - name: Show remaining vulnerable dependency paths
        run: npm ls @babel/core brace-expansion browserslist js-yaml --all || true
