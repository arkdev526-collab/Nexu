name: Minted Up Dependency Audit

on:
  push:
    branches:
      - chatgpt/mintedup-production-hardening
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: npm audit report
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Audit dependency tree
        run: npm audit --json > npm-audit.json || true

      - name: Print audit summary
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const audit = JSON.parse(fs.readFileSync('npm-audit.json', 'utf8'));
          console.log(JSON.stringify({
            metadata: audit.metadata,
            vulnerabilities: audit.vulnerabilities,
          }, null, 2));
          NODE
