name: Minted Up R2 Dependency Helper

on:
  push:
    branches:
      - chatgpt/mintedup-r2-storage

permissions:
  contents: write

jobs:
  install:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: chatgpt/mintedup-r2-storage

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install exact S3-compatible storage dependencies
        run: npm install --save-exact @aws-sdk/client-s3 @aws-sdk/s3-request-presigner

      - name: Commit npm-generated manifests
        run: |
          if git diff --quiet -- package.json package-lock.json; then
            echo "Dependencies already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "Add S3-compatible object storage dependencies"
          git push origin HEAD:chatgpt/mintedup-r2-storage
